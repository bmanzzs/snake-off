<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Snake</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-size: 24px; pointer-events: none; }
        #game-over { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            color: white; text-align: center; background: rgba(0,0,0,0.8); padding: 40px; 
            border-radius: 20px; display: none;
        }
        #game-over.visible { display: block; }
        .key { background: #444; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
        button { 
            margin-top: 20px; padding: 10px 20px; font-size: 18px; cursor: pointer; 
            background: #4CAF50; color: white; border: none; border-radius: 5px; 
        }
        button:hover { background: #45a049; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "./js/three.module.js"
        }
    }
    </script>
</head>
<body>
    <div id="ui">
        <div id="score">Score: 0</div>
    </div>
    <div id="game-over">
        <h1>GAME OVER</h1>
        <p>Press <span class="key">R</span> or Click to Restart</p>
        <button id="restart-btn">Restart</button>
    </div>
    <script type="module" src="js/game.js"></script>
</body>
</html>
